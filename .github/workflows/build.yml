name: Build HyprPanelswaync

on:
  push:
    branches:
      - "feat/swaync-integration"
  pull_request:
    branches:
      - "feat/swaync-integration"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3-gi gir1.2-gtk-3.0 libsoup-3.0-dev libgtop2-dev upower python3-pip

      - name: Install Node.js dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build || true # if this step is needed and doesn't exist, ignore

      - name: Build HyprPanelswaync (Meson)
        run: |
          meson setup build
          meson compile -C build
